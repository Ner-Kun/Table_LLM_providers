{% extends "base.html" %}

{% block extrahead %}
  <!-- Primary Meta Tags -->
  <meta name="title" content="LLM provider table">
  <meta name="description" content="A table of free, freemium, and paid LLM providers. It includes limits, registration requirements, Base URLs, and links to obtain API keys.">
  <meta name="author" content="Ner_Kun">
  
  <!-- Open Graph -->
  <meta property="og:type" content="website">
  <meta property="og:url" content="{{ config.site_url }}">
  <meta property="og:title" content="LLM provider table">
  <meta property="og:description" content="A table of free, freemium, and paid LLM providers. It includes limits, registration requirements, Base URLs, and links to obtain API keys.">
  <meta property="og:site_name" content="LLM Providers Table">
  
  <!-- X -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:url" content="{{ config.site_url }}">
  <meta name="twitter:title" content="LLM provider table">
  <meta name="twitter:description" content="A table of free, freemium, and paid LLM providers. It includes limits, registration requirements, Base URLs, and links to obtain API keys.">
  
  <!-- Additional Meta Tags -->
  <meta name="keywords" content="LLM, API, providers, free, freemium, paid, OpenAI, Claude, GPT, AI, language models">
  <meta name="robots" content="index, follow">
  <link rel="canonical" href="{{ config.site_url }}">
{% endblock %}
