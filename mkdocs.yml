site_name: LLM Providers Table
site_url: https://ner-kun.github.io/Table_LLM_providers/
site_author: Ner_Kun
site_description: Free, freemium, and paid LLM API providers table

copyright: Made with ❤️ by Ner_Kun

nav:
- Home: index.md
- Freemium: freemium.md
- Free: free.md
- Paid: paid.md
- Warning: caution.md
- Dangerous: dangerous.md
- Changelog: changelog.md

theme:
  name: material
  custom_dir: overrides
  favicon: images/favicon.png
  logo: images/logo-192.png
  palette:
  - scheme: slate
    primary: blue grey
    accent: cyan
  features:
  - navigation.footer
  - navigation.top
  - search.suggest
  - search.highlight
  - content.code.copy
  - content.code.annotate
  - content.tooltips
  - toc.integrate

plugins:
- search

markdown_extensions:
- tables
- attr_list
- admonition
- pymdownx.details
- pymdownx.superfences
- pymdownx.tilde
- pymdownx.emoji:
    emoji_index: !!python/name:material.extensions.emoji.twemoji ""
    emoji_generator: !!python/name:material.extensions.emoji.to_svg ""
extra:
  generator: false
  social:
  - icon: fontawesome/brands/github
    link: https://github.com/Ner-Kun/Table_LLM_providers
  - icon: fontawesome/brands/telegram
    link: https://t.me/ner_kun_off
  - icon: fontawesome/brands/discord
    link: https://discord.gg/wp2b5sHbzB

extra_css:
- stylesheets/custom.css
- stylesheets/icons.css
- stylesheets/components/tables.css
- stylesheets/components/admonitions.css
- stylesheets/components/accessibility.css
- stylesheets/components/code-blocks.css
- stylesheets/components/navigation.css
- stylesheets/components/additional.css
- stylesheets/components/screenshot-gallery.css
- stylesheets/components/glass-header.css
- stylesheets/components/header-stats.css
- stylesheets/modal/modal.css
- stylesheets/providers/source-badge.css
- stylesheets/providers/service-status.css
- stylesheets/providers/provider-meta.css
