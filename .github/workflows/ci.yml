name: ci
on:
  push:
    branches:
    - master
    - main
permissions:
  contents: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - name: Configure Git Credentials
      run: |
        git config user.name github-actions[bot]
        git config user.email 41898282+github-actions[bot]@users.noreply.github.com
    - uses: actions/setup-python@v5
      with:
        python-version: 3.x
    - id: cache-id
      run: echo "cache_id=$(date --utc '+%V')" >> $GITHUB_OUTPUT
    - uses: actions/cache@v4
      with:
        key: mkdocs-material-${{ steps.cache-id.outputs.cache_id }}
        path: ~/.cache
        restore-keys: |
          mkdocs-material-
    - run: pip install mkdocs-material
    - name: Track provider updates
      run: python .github/scripts/track_updates.py
    - name: Commit changelog updates
      run: |
        git add docs/changelog.md docs/index.md
        git diff --staged --quiet || git commit -m "chore: update changelog [skip ci]"
        git push || true
    - run: mkdocs gh-deploy --force
