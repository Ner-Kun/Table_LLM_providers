name: ci
on:
  push:
    branches:
    - master
    - main
  schedule:
    - cron: '0 */12 * * *'  # Every 12 hours
  workflow_dispatch:  # Manual trigger

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - name: Configure Git Credentials
      run: |
        git config user.name github-actions[bot]
        git config user.email 41898282+github-actions[bot]@users.noreply.github.com
    - uses: actions/setup-python@v5
      with:
        python-version: 3.x
    - id: cache-id
      run: echo "cache_id=$(date --utc '+%V')" >> $GITHUB_OUTPUT
    - uses: actions/cache@v4
      with:
        key: mkdocs-material-${{ steps.cache-id.outputs.cache_id }}
        path: ~/.cache
        restore-keys: |
          mkdocs-material-
    - run: pip install mkdocs-material
    - name: Sync providers from JSON config
      run: python .github/scripts/sync_provider.py
    - name: Update model lists
      env:
        # API keys for providers that require auth to fetch /v1/models
        # Add new secrets here as needed (Settings → Secrets and variables → Actions)
        AGENT_ROUTER_API_KEY: ${{ secrets.AGENT_ROUTER_API_KEY }}
        CROWAI_API_KEY: ${{ secrets.CROWAI_API_KEY }}
        GOOGLE_AI_STUDIO_API_KEY: ${{ secrets.GOOGLE_AI_STUDIO_API_KEY }}
        MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
        CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
        GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        SWIFTROUTER_API_KEY: ${{ secrets.SWIFTROUTER_API_KEY }}
      run: python .github/scripts/update_models.py
    - name: Track provider updates
      run: python .github/scripts/track_updates.py
    - name: Clear providers.json after sync
      run: echo '[]' > .github/scripts/providers.json
    - name: Commit updates
      run: |
        git add docs/changelog.md docs/index.md docs/models_data.json .github/scripts/providers.json docs/*.md
        git diff --staged --quiet || git commit -m "chore: auto-update models and changelog [skip ci]"
        git push
    - run: mkdocs gh-deploy --force
